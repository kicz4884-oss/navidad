    <main class="tres">
        <form>
            <button type="button" onclick="alert('1. El niño Jesús\nHace muchísimo tiempo, en un humilde establo de Belén rodeado de animales y iluminado por una enorme estrella en el cielo, nació el Niño Jesús. Aunque llegó al mundo en una sencilla cuna de paja junto a sus padres María y José, su nacimiento trajo una luz de esperanza, bondad y amor infinito para toda la humanidad. Por él celebramos la Navidad cada 25 de diciembre, recordando que los regalos más valiosos no son los materiales, sino la unión familiar, la generosidad y el cariño que compartimos con los demás.')">
                <img src="../Images/pesebre.jpeg" alt="">
            </button>
        </form>
        <form>
            <button type="button" onclick="alert('2. Los Tres Reyes Magos\nMelchor, Gaspar y Baltasar eran tres hombres muy sabios que vivían en tierras lejanas y estudiaban las estrellas del cielo. Una noche descubrieron un astro brillante que anunciaba la llegada de un nuevo rey y decidieron emprender un largo viaje guiados por su resplandor. Al llegar al pesebre de Belén, se arrodillaron ante el Niño Jesús y le entregaron tres tesoros muy especiales: oro, por ser un rey; incienso, por su divinidad; y mirra, como símbolo de su humanidad. Desde entonces, representan la alegría de dar regalos con el corazón.')">
                <img src="../Images/Tres-Reyes.jfif" alt="">
            </button>
        </form>
        <form>
            <button type="button" onclick="alert('3. Santa Claus (Papá Noel)\nEn lo más profundo del Polo Norte, rodeado de nieve eterna, vive Santa Claus, un anciano bonachón de mejillas sonrosadas, larga barba blanca y traje rojo que siempre lleva una sonrisa en el rostro. Inspirado en la generosidad de San Nicolás, dedica todo el año a leer las cartas de los niños del mundo y a preparar juguetes con mucho cariño. Durante la mágica Nochebuena, sube a su trineo volador tirado por renos mágicos y recorre el planeta entero en una sola noche para dejar sorpresas bajo el árbol de quienes se esforzaron por ser buenos y amables.')">
                <img src="../Images/Santa.jfif" alt="">
            </button>
        </form>
        <form>
            <button type="button" onclick="alert('4. El Reno Rodolfo (Rudolph)\nEntre todos los renos que tiran del trineo de Santa Claus, Rodolfo es el más especial y querido por todos los niños. Nació con una nariz redonda y tan roja que brillaba en la oscuridad como una pequeña estrella. Aunque al principio algunos se burlaban de él por ser diferente, una Nochebuena en la que cayó una tormenta de nieve tan espesa que nadie podía ver el camino, Santa Claus le pidió que fuera al frente del trineo. Desde ese día, la brillante nariz de Rodolfo ilumina el cielo nocturno y demuestra que aquello que nos hace únicos puede convertirse en nuestro mayor superpoder.')">
                <img src="../Images/Reno.jfif" alt="">
            </button>
        </form>
        <form>
            <button type="button" onclick="alert('5. El Árbol de Navidad\nAunque no camina ni habla, el Árbol de Navidad es el gran protagonista de todos los hogares durante diciembre. Sus ramas siempre verdes simbolizan la vida y la esperanza incluso en los días más fríos del año. Las familias se reúnen alrededor de él para decorarlo juntas con esferas de colores, guirnaldas, luces brillantes que parecen pequeñas estrellas y una gran estrella en la punta que recuerda la luz de Belén. Debajo de sus ramas descansan los regalos, convirtiéndolo en el punto de encuentro donde nacen los abrazos y los recuerdos más felices de las fiestas.')">
                <img src="../Images/Arbol.jfif" alt="">
            </button>
        </form>
    </main>
